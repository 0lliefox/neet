# Client-side topic filter (posts must match >=1 topic term OR come from a seed/local author to be stored).
topics:
  flood: [flood, flooding, flooded, "burst main", "burst water main", "water main", "surface water", "river level", "Tyne level", overflow, "storm drain", "standing water"]
  roadworks: [roadworks, "road works", "road closed", "road closure", closure, closed, diversion, "temporary lights", "traffic lights", "lane closed", "lane closure", resurfacing, "gas works", "water works", excavation, "footpath closed", "footway closed", "pavement closed"]
  transport: [Metro, "no trains", "trains cancelled", "train cancelled", "Metro delays", "Metro delay", "Metro suspended", "replacement bus", "bus replacement", "line closure", "bus cancelled", "buses cancelled", "bus delays", "Tyne Tunnel", "ferry", disruption, disrupted, delays, delayed, "signal failure", "signalling", diverted, "buses diverted", "bus diverted", "diverted via"]
  weather: [storm, "weather warning", "yellow warning", "amber warning", "red warning", gale, "high winds", "strong winds", snow, ice, icy, gritting, gritter, fog, heatwave, "heavy rain", downpour, thunder, lightning, hail, "Storm "]
  crime: [police, "anti-social", "antisocial", "anti social", burglary, robbery, assault, stabbing, "shop lifting", shoplifting, vandalism, "arrested", "crime", "incident", "cordon", "cordoned"]
  infrastructure: [pothole, potholes, "street light", "streetlight", "street lights", "traffic light", "bin collection", "bins", "fly tipping", "fly-tipping", "pavement", "kerb", "drain", "blocked drain", "sinkhole", "collapsed", "scaffolding"]
