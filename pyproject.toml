[project]
name = "neet"
version = "0.1.0"
description = "North East civic claim verification dataset pipeline"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.44",
    "python-dotenv>=1.0",
    "mapbox-vector-tile>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
neet = "scraper.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
